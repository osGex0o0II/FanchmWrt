name: 功能建议
description: 提出可讨论的 FanchmWrt 功能改进
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        功能建议不等同于已确认的缺陷。请说明使用场景、边界和可接受的替代方案。
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 请描述实际场景、受影响对象和现有方案的限制。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 请说明期望行为、配置入口和兼容性考虑。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 已考虑的替代方案
  - type: textarea
    id: context
    attributes:
      label: 版本与补充信息
      description: 如与特定设备或构建有关，请提供目标、版本和相关配置。
