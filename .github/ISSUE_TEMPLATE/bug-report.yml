name: 错误报告
description: 报告可复现的 FanchmWrt 缺陷
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        请先确认问题可以稳定复现，并移除密码、令牌和其他敏感信息。
  - type: input
    id: version
    attributes:
      label: 版本或源码提交
      description: 请填写镜像版本，或自行构建时使用的提交 ID。
    validations:
      required: true
  - type: input
    id: target
    attributes:
      label: 目标与设备 Profile
      description: 例如 target/subtarget、设备型号和构建 Profile。
    validations:
      required: true
  - type: dropdown
    id: image_kind
    attributes:
      label: 镜像来源
      options:
        - 已发布镜像
        - 自行构建
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      description: 请提供最小、可重复的操作步骤。
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果与日志
      description: 请附脱敏后的完整错误、日志或截图说明。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: 相关配置
      description: 自行构建时请附最小 diffconfig 或相关配置片段。
      render: text
  - type: checkboxes
    id: terms
    attributes:
      label: 提交确认
      options:
        - label: 我已确认问题不包含敏感信息，并按上述步骤可复现。
          required: true
