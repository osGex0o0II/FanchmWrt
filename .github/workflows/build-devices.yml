name: Build FanchmWrt devices (nowifi)

on:
  workflow_dispatch:
    inputs:
      device:
        description: "Device to build (all = both)"
        required: true
        default: all
        type: choice
        options:
          - all
          - xg-040g-md
          - zn-m2
  push:
    branches:
      - feat/xg040g-md-znm2
    paths:
      - "fanchmwrt/configs/*.config"
      - "target/linux/airoha/**"
      - "target/linux/qualcommax/**"
      - ".github/workflows/build-devices.yml"
      - "feeds.conf.default"

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: xg-040g-md
            config: fanchmwrt/configs/airoha-xg-040g-md.config
          - name: zn-m2
            config: fanchmwrt/configs/qualcommax-zn-m2.config

    steps:
      - name: Skip unwanted device on dispatch
        id: skip
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ inputs.device }}" != "all" ] && [ "${{ inputs.device }}" != "${{ matrix.name }}" ]; then
              echo "skip=true" >> "$GITHUB_OUTPUT"
            else
              echo "skip=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.skip.outputs.skip != 'true'
        uses: actions/checkout@v4

      - name: Free disk space
        if: steps.skip.outputs.skip != 'true'
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true

      - name: Install build dependencies
        if: steps.skip.outputs.skip != 'true'
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses5-dev libssl-dev python3-setuptools rsync swig \
            unzip zlib1g-dev file wget ccache device-tree-compiler

      - name: Update & install feeds
        if: steps.skip.outputs.skip != 'true'
        run: |
          env -u http_proxy -u https_proxy -u HTTP_PROXY -u HTTPS_PROXY -u ALL_PROXY \
            ./scripts/feeds update -a
          ./scripts/feeds install -a -f

      - name: Configure (${{ matrix.name }})
        if: steps.skip.outputs.skip != 'true'
        run: |
          cp "${{ matrix.config }}" .config
          make defconfig
          [ -e .config ] && cp .config defconfig-final.config

      - name: Download package sources
        if: steps.skip.outputs.skip != 'true'
        run: |
          make download -j4 V=s
          find dl -size -1024c -delete

      - name: Compile firmware (${{ matrix.name }})
        id: compile
        if: steps.skip.outputs.skip != 'true'
        run: |
          make -j$(nproc) V=s || make -j1 V=s || exit 1
          echo "status=success" >> "$GITHUB_OUTPUT"

      - name: Set release tag
        id: tag
        if: steps.skip.outputs.skip != 'true' && steps.compile.outputs.status == 'success'
        run: |
          echo "tag=fanchmwrt-${{ matrix.name }}-nowifi-$(date +%Y%m%d%H%M)" >> "$GITHUB_OUTPUT"

      - name: Prepare artifacts
        id: organize
        if: steps.skip.outputs.skip != 'true' && steps.compile.outputs.status == 'success'
        run: |
          cd bin/targets/*/*
          rm -rf packages
          echo "FIRMWARE=$PWD" >> "$GITHUB_ENV"

      - name: Upload firmware artifacts
        if: steps.skip.outputs.skip != 'true' && steps.compile.outputs.status == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: FanchmWrt-${{ matrix.name }}-nowifi
          path: ${{ env.FIRMWARE }}/*

      - name: Publish GitHub Release
        if: steps.skip.outputs.skip != 'true' && steps.compile.outputs.status == 'success'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "FanchmWrt ${{ matrix.name }} nowifi"
          files: ${{ env.FIRMWARE }}/*
